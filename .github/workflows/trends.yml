name: Tendances Google Trends

# Chaque nuit : récupère les recherches « voyage + pays » et met à jour data/trends.json.
# Le commit déclenche un nouveau déploiement Vercel, donc le dashboard se met à jour seul.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Récupérer les tendances
        run: python scripts/fetch-trends.py
      - name: Publier si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json
          git diff --staged --quiet || (git commit -m "Tendances Google Trends du $(date -u +%F)" && git push)
