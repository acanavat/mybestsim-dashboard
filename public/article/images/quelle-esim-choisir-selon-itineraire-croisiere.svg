<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <title>Quelle eSIM choisir selon l'itinéraire de votre croisière</title>
  <rect width="960" height="560" rx="18" fill="#f5f8fd"/>
  <text x="40" y="56" font-size="26" font-weight="700" fill="#0e2b4d">Quelle eSIM selon votre croisière ?</text>
  <text x="40" y="84" font-size="16" fill="#64748b">Choisissez d'après vos escales, pas d'après le nom de la région</text>

  <g font-size="15" fill="#243447">
    <!-- ligne 1 -->
    <g transform="translate(40 110)">
      <rect width="280" height="200" rx="16" fill="#ffffff" stroke="#cfe0fb" stroke-width="2"/>
      <circle cx="40" cy="42" r="22" fill="#e8f1ff"/><circle cx="40" cy="42" r="20" fill="#1e63d7"/><circle cx="53" cy="42" r="2.2" fill="#ffcc00"/><circle cx="49.2" cy="51.2" r="2.2" fill="#ffcc00"/><circle cx="40" cy="55" r="2.2" fill="#ffcc00"/><circle cx="30.8" cy="51.2" r="2.2" fill="#ffcc00"/><circle cx="27" cy="42" r="2.2" fill="#ffcc00"/><circle cx="30.8" cy="32.8" r="2.2" fill="#ffcc00"/><circle cx="40" cy="29" r="2.2" fill="#ffcc00"/><circle cx="49.2" cy="32.8" r="2.2" fill="#ffcc00"/>
      <text x="74" y="38" font-size="17" font-weight="700" fill="#0e2b4d">Méditerranée</text>
      <text x="74" y="58" font-size="14" fill="#64748b">escales dans l'UE</text>
      <text x="22" y="104">Votre forfait français</text>
      <text x="22" y="126">suffit souvent.</text>
      <rect x="22" y="150" width="236" height="32" rx="8" fill="#e8f7e8"/>
      <text x="36" y="171" font-size="14" font-weight="700" fill="#2f7d32">+ eSIM Europe si peu de Go</text>
    </g>
    <g transform="translate(340 110)">
      <rect width="280" height="200" rx="16" fill="#ffffff" stroke="#f6c9c9" stroke-width="2"/>
      <circle cx="40" cy="42" r="22" fill="#fdecec"/><text x="40" y="51" font-size="26" font-weight="700" fill="#de1414" text-anchor="middle">!</text>
      <text x="74" y="38" font-size="17" font-weight="700" fill="#0e2b4d">Méditerranée</text>
      <text x="74" y="58" font-size="14" fill="#64748b">escales hors UE</text>
      <text x="22" y="104">Turquie, Tunisie, Maroc,</text>
      <text x="22" y="126">Égypte, Monténégro…</text>
      <rect x="22" y="150" width="236" height="32" rx="8" fill="#fdecec"/>
      <text x="36" y="171" font-size="14" font-weight="700" fill="#a11212">eSIM multi-pays qui les inclut</text>
    </g>
    <g transform="translate(640 110)">
      <rect width="280" height="200" rx="16" fill="#ffffff" stroke="#cfe0fb" stroke-width="2"/>
      <circle cx="40" cy="42" r="22" fill="#e8f1ff"/><path d="M24 54 L36 32 L43 44 L48 36 L58 54 Z" fill="#1e63d7"/><path d="M36 32 L40 39 L33 39 Z" fill="#ffffff"/>
      <text x="74" y="38" font-size="17" font-weight="700" fill="#0e2b4d">Fjords, Baltique</text>
      <text x="74" y="58" font-size="14" fill="#64748b">Europe du Nord</text>
      <text x="22" y="104">Norvège et Islande incluses</text>
      <text x="22" y="126">dans le roaming européen.</text>
      <rect x="22" y="150" width="236" height="32" rx="8" fill="#fff4e5"/>
      <text x="36" y="171" font-size="14" font-weight="700" fill="#8a4b05">Royaume-Uni : vérifiez</text>
    </g>
    <!-- ligne 2 -->
    <g transform="translate(40 330)">
      <rect width="280" height="200" rx="16" fill="#ffffff" stroke="#cfe0fb" stroke-width="2"/>
      <circle cx="40" cy="42" r="22" fill="#e8f1ff"/><circle cx="48" cy="34" r="7" fill="#ffcc00"/><path d="M22 52 Q 31 46 40 52 T 58 52" fill="none" stroke="#1e63d7" stroke-width="3" stroke-linecap="round"/>
      <text x="74" y="38" font-size="17" font-weight="700" fill="#0e2b4d">Caraïbes</text>
      <text x="74" y="58" font-size="14" fill="#64748b">et Bahamas</text>
      <text x="22" y="104">Un pays différent presque</text>
      <text x="22" y="126">à chaque escale.</text>
      <rect x="22" y="150" width="236" height="32" rx="8" fill="#e8f1ff"/>
      <text x="36" y="171" font-size="14" font-weight="700" fill="#1e63d7">eSIM Monde conseillée</text>
    </g>
    <g transform="translate(340 330)">
      <rect width="280" height="200" rx="16" fill="#ffffff" stroke="#cfe0fb" stroke-width="2"/>
      <circle cx="40" cy="42" r="22" fill="#e8f1ff"/><circle cx="40" cy="42" r="11" fill="#de1414"/>
      <text x="74" y="38" font-size="17" font-weight="700" fill="#0e2b4d">Asie</text>
      <text x="74" y="58" font-size="14" fill="#64748b">Japon, Singapour, Thaïlande</text>
      <text x="22" y="104">Une eSIM régionale couvre</text>
      <text x="22" y="126">la plupart des itinéraires.</text>
      <rect x="22" y="150" width="236" height="32" rx="8" fill="#e8f1ff"/>
      <text x="36" y="171" font-size="14" font-weight="700" fill="#1e63d7">eSIM Asie</text>
    </g>
    <g transform="translate(640 330)">
      <rect width="280" height="200" rx="16" fill="#ffffff" stroke="#cfe0fb" stroke-width="2"/>
      <circle cx="40" cy="42" r="22" fill="#e8f1ff"/><circle cx="40" cy="42" r="13" fill="none" stroke="#1e63d7" stroke-width="2.5"/><ellipse cx="40" cy="42" rx="5.5" ry="13" fill="none" stroke="#1e63d7" stroke-width="2"/><path d="M27 42 H53" stroke="#1e63d7" stroke-width="2"/>
      <text x="74" y="38" font-size="17" font-weight="700" fill="#0e2b4d">Tour du monde</text>
      <text x="74" y="58" font-size="14" fill="#64748b">transatlantique, Alaska</text>
      <text x="22" y="104">Longues journées en mer,</text>
      <text x="22" y="126">plusieurs continents.</text>
      <rect x="22" y="150" width="236" height="32" rx="8" fill="#e8f1ff"/>
      <text x="36" y="171" font-size="14" font-weight="700" fill="#1e63d7">eSIM Monde + eSIM croisière</text>
    </g>
  </g>
</svg>
